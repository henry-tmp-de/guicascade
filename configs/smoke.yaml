# 冒烟配置：验证级联控制流，**不需要模型服务、不需要 torch、不需要模拟器**
#
#   python scripts/run_agent.py --config configs/smoke.yaml --env scripted \n#       --env-config '{"screens": ["a","b","c","d","e"]}' --task test --max-steps 5
#
# 全程用假模型 + 假环境 + 假监控器，三十秒内跑完，用来确认「监控器报警 -> 升级 -> 交接」这条链路是通的。
policy:
  type: cascade
  small:
    type: single
    label: small
    action_space: {type: android}
    model: {type: scripted, name: fake-small,
            script: ["打开设置。\nAction: click(index=1)",
                     "继续。\nAction: click(index=2)",
                     "再点。\nAction: click(index=3)",
                     "还是它。\nAction: click(index=4)"]}
  large:
    type: single
    label: large
    is_strong: true
    action_space: {type: android}
    model: {type: scripted, name: fake-large,
            script: ["换个思路。\nAction: click(index=9)"]}
  router:
    type: cascade_router
    theta_stuck: 0.5
    hold_steps: 1
    stuck:
      type: scripted
      scores: [0.0, 0.0, 0.9, 0.9, 0.9, 0.9]   # 第 3 步开始报警
